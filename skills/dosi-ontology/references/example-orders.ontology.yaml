# A complete, validated example: orders / customers / products (model-first).
# Three files: model-orders.yaml (the model), this ontology (concepts only),
# example-orders.mapping.yaml (which column each concept and link is).
# Check: dosi --mapping example-orders.mapping.yaml validate
version: 0.2.0.dev0
name: Sales
description: >
  Orders, customers and products. An Order is placed by one Customer and
  purchases one Product; region belongs to the customer, category to the product.

ontology:
# ---------------------------------------------------------------- value types
- concept: OrderId
  description: Order id
  type: ValueType
  extends: [ String ]
- concept: CustomerId
  description: Customer id
  type: ValueType
  extends: [ String ]
- concept: ProductId
  description: Product id
  type: ValueType
  extends: [ String ]
- concept: Region
  description: The customer's region (north/east/south/west)
  type: ValueType
  extends: [ String ]
- concept: Category
  description: Product category (home/electronics/books/toys)
  type: ValueType
  extends: [ String ]
- concept: OrderStatus
  description: Order status (completed / cancelled)
  type: ValueType
  extends: [ String ]
  requires: [ "OrderStatus == 'completed' OR OrderStatus == 'cancelled'" ]
- concept: Amount
  description: Order amount
  type: ValueType
  extends: [ Decimal ]
- concept: UnitCost
  description: Product unit cost
  type: ValueType
  extends: [ Decimal ]

# --------------------------------------------------------------- entity types
- concept: Customer
  description: A customer
  type: EntityType
  identify_by: [ id ]
  relationships:
  - name: id
    roles: [ { concept: CustomerId } ]
    multiplicity: OneToOne
    verbalizes: [ '{Customer} is identified by {CustomerId}' ]
  - name: region
    roles: [ { concept: Region } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Customer} is located in {Region}' ]
  - name: signup_date
    roles: [ { concept: Date } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Customer} signed up on {Date}' ]

- concept: Product
  description: A product
  type: EntityType
  identify_by: [ id ]
  relationships:
  - name: id
    roles: [ { concept: ProductId } ]
    multiplicity: OneToOne
    verbalizes: [ '{Product} is identified by {ProductId}' ]
  - name: category
    roles: [ { concept: Category } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Product} belongs to {Category}' ]
  - name: unit_cost
    roles: [ { concept: UnitCost } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Product} costs {UnitCost} per unit' ]

- concept: Order
  description: An order, one per row
  type: EntityType
  identify_by: [ id ]
  relationships:
  - name: id
    roles: [ { concept: OrderId } ]
    multiplicity: OneToOne
    verbalizes: [ '{Order} is identified by {OrderId}' ]
  - name: placed_by
    roles: [ { concept: Customer } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Order} is placed by {Customer}', '{Customer} places {Order}' ]
  - name: purchases
    roles: [ { concept: Product } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Order} purchases {Product}', '{Product} is purchased in {Order}' ]
  - name: order_date
    roles: [ { concept: Date } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Order} was placed on {Date}' ]
  - name: status
    roles: [ { concept: OrderStatus } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Order} has status {OrderStatus}' ]
  - name: amount
    roles: [ { concept: Amount } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Order} is worth {Amount}' ]
