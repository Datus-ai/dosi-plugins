# Written by dosi itself: the DATUS extension contract dosi gives Datus's
# modeling agent (dosi_engine.render_datus_authoring_spec()), from osi-engine
# 22db1384. Regenerate it whenever DOSI_MIN_VERSION changes:
#   python3 -c 'import dosi_engine; print(dosi_engine.render_datus_authoring_spec(), end="")'
# Generated by dosi-engine from the active DATUS contract.
# contract_digest: sha256:25956e537e8b6632660fb5fcf386ae7942c82709b856afcaafbe55115a1460f6
# SQL expressions and predicates must use the active OSI expression dialect.
authoring_guidance:
- capability: OSI base metric
  use_when: The business value is one aggregate, ratio, or arithmetic expression over source fields.
- avoid_when: The denominator counts only entities observed in the fact; write COUNT(DISTINCT fact.dim_fk), which stays on the fact under every grouping.
  capability: OSI dimension count in a cross-dataset ratio
  use_when: The denominator counts every entity of a dimension dataset, COUNT(DISTINCT dim.k); it evaluates on that dataset whenever the query grouping reaches it.
- avoid_when: The condition is only an ad-hoc query filter.
  capability: D-DERIVE filter
  use_when: Create a reusable governed subset of an existing base metric.
- capability: D-DERIVE compose
  use_when: Define arithmetic over existing metrics.
- avoid_when: The grain is the same for every view; that is a `fixed` D-LOD field, which can also be grouped and filtered on.
  capability: D-DERIVE lod
  use_when: Pin an aggregation grain relative to the query's own group-by — per-entity averages, share of a coarser total.
- capability: D-WINDOW
  use_when: Define period comparison, rolling, cumulative, ranking, or value-navigation semantics.
- avoid_when: Do not parameterize SQL text, dates, dimensions, grains, functions, or dialects.
  capability: D-PARAM
  use_when: One governed metric varies by a query-time window count or filter literal.
- capability: D-MEASURE
  use_when: A stable explicit synthesized-measure name is required.
- avoid_when: A native DATE/TIMESTAMP field needs no storage conversion.
  capability: D-FORMAT
  use_when: A time field stores dates as strings or integers.
- avoid_when: The field is an ordinary categorical attribute — omit the key.
  capability: D-DIM
  use_when: A field is a measurement, an identifier, free text, or PII and should not be offered as a dimension (false); or a numeric field is meant to be grouped in buckets (true).
- avoid_when: The value is only needed as a number at the query grain; use a metric.
  capability: D-LOD
  use_when: A per-entity aggregate (days active per user, first purchase date, users per day) must be grouped by, filtered on, or re-aggregated as if it were a column.
- avoid_when: One dataset is a dimension table of the other; declare the ordinary many_to_one relationship.
  capability: D-CONFORM
  use_when: Two fact datasets share dimensions (date, platform) but neither is the many side of the other, and a compose metric must align them (payers / users by date).
capabilities:
- carriers:
  - relationship
  extension: D-JOIN
  fallback: the join falls back to LEFT, so orphan rows stay in the result (S-JOIN-1)
  impact: documented
  key: join_type
  since: '1.0'
- carriers:
  - metric
  extension: D-FILL
  fallback: a missing merge group reads NULL (count metrics still fill 0 per S-FAN-6)
  impact: documented
  key: fill_nulls_with
  since: '1.0'
- carriers:
  - dataset
  - metric
  extension: D-TIME
  fallback: the primary time dimension falls back to the dataset's single is_time field, and `metric_time` fails to resolve where there is no unique one (S-TIME-5)
  impact: degraded
  key: time_dimension
  since: '1.1'
- carriers:
  - field
  extension: D-GRAIN
  fallback: no native grain is known, so any grain may be requested and a request finer than the stored grain returns sparse rows instead of `grain_too_fine`
  impact: documented
  key: time_granularity
  since: '1.1'
- carriers:
  - metric
  extension: D-WINDOW
  fallback: no window derivation applies — the metric is its plain base aggregate (no offset comparison, rolling frame, or cumulative reset)
  impact: documented
  key: window
  since: '1.2'
- carriers:
  - metric
  extension: D-DATASET
  fallback: COUNT(*) attribution is SQL-derived only, and raises `count_star_needs_dataset` where the SQL does not pin one
  impact: degraded
  key: dataset
  since: '1.1'
- carriers:
  - metric
  extension: D-DERIVE
  fallback: no derive applies — the metric reads as its flattened expression (subset/composition structure, conformed-dimension validation and attribution metadata are unavailable)
  impact: degraded
  key: derive
  since: '1.4'
- carriers:
  - metric
  extension: D-MEASURE
  fallback: measure names revert to the generated stem (the aggregate's letters and digits, tagged by signature when two still coincide)
  impact: silent
  key: measure
  since: '1.4'
- carriers:
  - metric
  - field
  extension: D-PARAM
  fallback: every parameter slot takes its declared default, and a query-time `params` binding is rejected as unknown_metric_param
  impact: degraded
  key: params
  since: '1.5'
- carriers:
  - field
  extension: D-FORMAT
  fallback: the column is assumed to be a native DATE/TIMESTAMP, so a grain rollup is a warehouse type error and a time range silently returns the wrong rows or none
  impact: silent
  key: time
  since: '1.6'
- carriers:
  - field
  extension: D-DIM
  fallback: the field's dimension role falls back to engine inference (keys, relationship columns and aggregated columns are not offered), so a measure column, business key or PII column no metric reads is offered as a dimension
  impact: documented
  key: is_dimension
  since: '1.7'
- carriers:
  - relationship
  extension: D-CONFORM
  fallback: the relationship is followed as an ordinary many→one join, so the two facts are joined row-to-row and duplicate-sensitive aggregates (SUM/AVG/COUNT) across it fan out — wrong numbers with no diagnostic
  impact: silent
  key: cardinality
  since: '1.8'
- carriers:
  - field
  extension: D-LOD
  fallback: the field is dropped (its expression is an aggregate, which is not a legal row-level attribute), so metrics and queries referencing it fail closed with unknown_field instead of returning a wrong grain
  impact: degraded
  key: lod
  since: '1.10'
- carriers:
  - mapping
  extension: D-PARAM
  fallback: a derived subtype whose rule has `:name` placeholders is recorded unmapped (describable, not queryable) and a query-time `params` binding for it is rejected as unknown_metric_param; literal rules are unaffected
  impact: degraded
  key: concept_params
  since: '1.12'
carriers:
  dataset:
    time_dimension:
      reference: time field in this dataset
      rule: The field exists and has dimension.is_time=true.
      type: string
  field:
    is_dimension:
      purpose: Whether to offer this field as a grouping dimension.
      rule: Omit to let the engine infer. false keeps the field out of list_dimensions recommendations and attribution candidates; true forces it in. Never blocks an explicitly named group_by.
      type: boolean
    lod:
      schema_ref: definitions.lod
    params:
      default: []
      rule: Declares every :name hole in this field's expression (field.literal); the field compiles at the defaults and a query binds one value per name through params. Not on a lod field, whose parameters are its base metric's.
      schema_ref: definitions.parameter_declaration
      type: array
    time:
      schema_ref: definitions.time
    time_granularity:
      enum:
      - day
      - week
      - month
      - quarter
      - year
      rule: The carrying field has dimension.is_time=true.
  mapping:
    concept_params:
      rule: On an Ossie mapping document only. Each key names a derived subtype (an EntityType with extends and a derived_by rule); its array declares every :name placeholder of that rule, one-to-one. Literal rules need no entry.
      shape:
        <Concept>: array, schema_ref definitions.parameter_declaration
      type: object
  metric:
    dataset:
      purpose: Attribute an otherwise unattributable aggregate such as COUNT(*).
      type: string
    derive:
      schema_ref: definitions.derive
    fill_nulls_with:
      type: finite number
    measure:
      schema_ref: definitions.measure
    params:
      default: []
      schema_ref: definitions.parameter_declaration
      type: array
    time_dimension:
      reference: field or qualified dataset.field
      type: string
    window:
      schema_ref: definitions.window
  relationship:
    cardinality:
      default: many_to_one
      enum:
      - many_to_one
      - many_to_many
      schema_ref: definitions.cardinality
    join_type:
      default: left
      enum:
      - left
      - inner
      rule: Not allowed together with cardinality many_to_many.
contract_schema_version: 1
definitions:
  cardinality:
    rules:
    - many_to_one (the default) is an ordinary foreign-key join the planner follows from the many side to the one side.
    - 'many_to_many declares a conformed pairing between two facts: each from/to column pair is the same dimension spelled on each side (a date and a date, a platform id and a platform id).'
    - A many_to_many relationship is never joined row-to-row; each fact aggregates alone and the branches merge on the paired columns, so grouping or filtering by either spelling works for metrics on either fact.
    - Paired columns must agree on dimension.is_time and, when both declare a datatype, on the datatype; a dataset contributes at most one column to a conformed class.
    - join_type is invalid on a many_to_many relationship.
    - 'Include cardinality in requires: an engine that ignores it joins the facts row-to-row and fans out duplicate-sensitive aggregates.'
    shape:
      cardinality:
        enum:
        - many_to_one
        - many_to_many
  derive:
    families:
      compose:
        required:
        - type
        - expr
        shape:
          expr: scalar arithmetic over metric names
          fill: optional finite number
          type: compose
      filter:
        required:
        - type
        - base
        - where
        shape:
          base: plain aggregate metric name
          type: filter
          where: SQL predicate in the active OSI dialect
      lod:
        required:
        - type
        - expr
        shape:
          expr: avg(include(base, dataset.field, ...)), exclude(base, dataset.field, ...) or fixed(base[, dataset.field, ...])
          type: lod
    rules:
    - Filter predicates fold into the aggregate argument and cannot contain aggregates, subqueries, or windows.
    - Compose identifiers resolve only to metric names.
    - Compose members may be leaves, filters, windows, or other compose metrics. Nested compose members expand inline on the flatten tier and remain members on the stage tier. Use a compose stage to carry a window result into another window; unsupported dependency graphs fail native validation.
    - A compose containing window members requires one shared time axis.
    - Flatten-tier fallback expressions must be equivalent; stage-tier expressions are basic-mode approximations.
    - A lod expr wraps include(...) in exactly one aggregate and never wraps exclude(...) or fixed(...); its dimensions are dataset.field on the base metric's own dataset.
    - 'include computes finer than the view and collapses back (per-user average reported by channel); exclude computes the view''s own grouping minus its dimensions and attaches the result (a share of the coarser total). A query must group by every dimension exclude names, at any grain, or it is refused with lod_dimension_not_grouped: excluding a dimension the view does not carry would remove nothing.'
    - 'fixed on a metric attaches base computed at exactly the listed dimensions, before the query''s dimension filter: fixed(revenue) is the whole-table total a where_sql filter does not narrow (a percent-of-total denominator), where exclude(revenue) totals only the filtered rows. Every listed dimension must be one the query groups by, without a grain, or it is refused with lod_dimension_not_grouped; to re-aggregate fixed values across keys, declare a fixed D-LOD field and aggregate it with an ordinary metric. The metric catalog lists the dimensions exclude and fixed name as required_dimensions.'
    - base is a leaf aggregate or a filter derivation of one; a lod, window or compose metric is not a valid base.
    - A lod metric's expression is the nested aggregate the declaration describes, e.g. AVG(SUM(orders.amount)) for avg(include(revenue, orders.user_id)) and SUM(SUM(orders.amount)) for fixed(revenue); it is deliberately not executable.
  lod:
    required:
    - expr
    rules:
    - 'A field accepts only the fixed keyword and no outer aggregate: its value is one per key, so there is nothing to collapse. include/exclude are view-relative and live on a metric (derive type lod).'
    - 'The field''s value is base evaluated over the dataset grouped by the listed keys (Tableau {FIXED [dims]: base}); the field is a per-entity aggregate, not a stored column. No keys is the table-scoped FIXED, one value broadcast onto every row.'
    - Write the field expression as the base metric's aggregate verbatim (COUNT(DISTINCT event_date), MIN(event_date), ...); it must agree with base.
    - 'base is a metric that is a single plain aggregate (a leaf, or a filter derivation of one), usually over the same dataset. It may aggregate another dataset when every key corresponds to a column of it through a declared relationship — a many_to_one edge between the two, a many_to_one path from base''s dataset to this one, or a cardinality many_to_many pairing — never by matching column names. The value is then that dataset''s rows per key, LEFT JOINed onto this dataset''s rows: a COUNT reads 0 where nothing matches, so > 0 / = 0 / >= n mean has / has none / at least n there; any other aggregate reads NULL.'
    - 'A cross-dataset field''s own time window goes in base (a filter metric): a query time range on this dataset''s axis reaches the other dataset only through a conformed pair of that column.'
    - A field whose value is scoped to its own window (days active in a month the query names) uses a filter base with parameters, e.g. login_days_in_window = filter of login_days where logins.login_day >= :window_start AND logins.login_day <= :window_end, and fixed(login_days_in_window, logins.player_id). A query reading the field binds those parameters through params; never write the dates into the model. Such a query keeps its own window in where_sql, not time_range, which would also scope the rollup.
    - The carrying field must not have dimension.is_time=true.
    - Keys must be row-level fields of the same dataset (field or dataset.field); a key that is itself a lod field is invalid.
    - Re-aggregate a lod field with an ordinary metric (AVG(sessions.daily_users)); there is no separate keyword.
    - A row-level field expression may read a lod field; the field is then evaluated once per key (Tableau's aggregation of a FIXED-only expression).
    - A fixed value, on a field or on a metric (derive type lod), follows the query's time range and context_filter but not where_sql. Its description states what the value means — a company-wide total, a first order over all history, the login days in a window its parameters name — not how to query it.
    - Include lod in requires.
    shape:
      expr: fixed(base, dataset.field, ...) — one level-of-detail expression, the same grammar derive.type=lod uses
  measure:
    required:
    - name
    rules:
    - Use only on a metric containing exactly one aggregate.
    - Whenever measure is present, include measure in requires.
    shape:
      name: non-empty string
  parameter_declaration:
    required:
    - name
    - type
    - default
    rules:
    - Parameter names are unique within a metric.
    - allowed and min/max are mutually exclusive.
    - A string parameter cannot use min/max.
    - A parameter without a domain compiles with datus_param_unbounded.
    - A window slot requires an int parameter whose domain lower bound meets the slot minimum.
    - A :name reference is legal inside a derive filter predicate, inside the expression of a field that declares params, and inside a derived subtype's derived_by rule whose mapping declares concept_params.
    - A filter predicate with parameters must still reference a column.
    - A parameter a field declares binds one value per query (no list expansion), also when a metric reads that field.
    - The authored filter expression equals the default-parameter instantiation.
    - A compose inherits member parameters; the same name must have identical type, default, and domain.
    shape:
      allowed: non-empty array
      default: same type and inside domain
      description: optional string
      max: closed upper bound
      min: closed lower bound
      name: '[a-z][a-z0-9_]*'
      type:
      - int
      - float
      - string
    slots:
    - id: offset.count
      minimum: 1
      parameter_types:
      - int
      reference: '{"param":"<name>"}'
    - id: frame.preceding
      minimum: 0
      parameter_types:
      - int
      reference: '{"param":"<name>"}'
    - id: rolling.periods
      minimum: 1
      parameter_types:
      - int
      reference: '{"param":"<name>"}'
    - id: rank.buckets
      minimum: 1
      parameter_types:
      - int
      reference: '{"param":"<name>"}'
    - id: value.n
      minimum: 1
      parameter_types:
      - int
      reference: '{"param":"<name>"}'
    - id: filter.literal
      minimum: null
      parameter_types:
      - int
      - float
      - string
      reference: :<name>
    - id: field.literal
      minimum: null
      parameter_types:
      - int
      - float
      - string
      reference: :<name>
  time:
    rules:
    - Use only on a field with dimension.is_time=true; describe the result of its expression.
    - Include time in requires. Missing declarations emit datus_ext_requires_missing in Datus mode.
    - Declare format and/or granularity; an empty time object and unknown keys are invalid.
    - Storage requires format. Native date/datetime/timestamp/timestamp_tz formats do not accept storage.
    - Integer storage allows continuous %Y%m%d%H%M%S prefixes without any literal text (at most 14 digits).
    - Granularity is inferred where possible; an explicit value cannot be finer than the encoding.
    - time.granularity and time_granularity are equal spellings and must agree when both are present.
    - Format describes storage encoding, not output display formatting.
    - Use time_range with YYYY-MM-DD bounds for encoded fields; query where_sql rejects references to them.
    - Month/year encodings require time_range bounds aligned to the stored period.
    - D-DERIVE and metric-expression filters require literals in the stored encoding; no automatic date conversion.
    shape:
      format:
        examples:
        - date
        - datetime
        - timestamp
        - timestamp_tz
        - '%Y%m%d'
        - '%Y-%m-%d'
        - '%Y/%m/%d'
        - '%Y%m'
        - '%Y'
        - '%Y-%m-%d %H:%M:%S'
        pattern_rules: Native date/datetime/timestamp/timestamp_tz, or a nonempty continuous prefix of %Y%m%d%H%M%S with arbitrary fixed literal text. %Y is four digits; all other components are two digits. %% escapes a literal percent. No skipped, reordered, repeated, variable-width, fractional-second or timezone directives.
        type: string
      granularity:
        enum:
        - day
        - week
        - month
        - quarter
        - year
      storage:
        default_for_patterns: string
        enum:
        - string
        - int
  window:
    base:
      required: false
      rule: May reference a leaf, filter, ratio, or compose metric. A prior window output must be wrapped in a compose stage before another window names it. Nesting is capped at three window levels, and level 2+ must declare partition explicitly.
      type: metric name
    forms:
      cumulative:
        required:
        - type
        - function
        shape:
          function: sum|avg|min|max|count|stddev_pop|stddev_samp|var_pop|var_samp
          reset: week|month|quarter|year or absent
          type: cumulative
      frame:
        required:
        - frame.function
        - exactly one of frame.preceding or frame.scope
        shape:
          frame:
            function:
              enum:
              - sum
              - avg
              - min
              - max
              - count
              - stddev_pop
              - stddev_samp
              - var_pop
              - var_samp
              - covar_pop
              - covar_samp
              - corr
            order:
              by: time|value; absent order defaults to time
              direction: 'asc|desc; omitted direction defaults by key: time->asc, value->desc'
              nulls: first|last or absent for dialect default
            partition:
              exclude:
                allowed_when: mode=query_dimensions_except
                required_non_empty_when_present: true
                type: array[qualified dataset.field]
              mode:
                enum:
                - query_dimensions
                - query_dimensions_except
                - time_bucket
                - none
            preceding: non-negative integer, unbounded, or parameter reference
            require_full_window: boolean = false
            reset: week|month|quarter|year
            scope: partition
            second: metric name for covar/corr
            units: rows|range = rows
      offset:
        required:
        - offset
        - calculation
        shape:
          calculation: value|delta|percent_change|ratio
          offset:
            count: integer >= 1 or parameter reference
            direction: back|forward = back
            granularity: day|week|month|quarter|year
      pop:
        required:
        - type
        - offset
        shape:
          calculation: value|delta|percent_change|ratio = percent_change
          offset: '''<positive integer> <granularity>'' or offset object'
          type: pop
      rank:
        required:
        - rank.function
        shape:
          rank:
            buckets: integer >= 1 or parameter reference; ntile only
            function:
              enum:
              - row_number
              - rank
              - dense_rank
              - ntile
              - percent_rank
              - cume_dist
            order:
              by: time|value; absent order defaults to value
              direction: 'asc|desc; omitted direction defaults by key: time->asc, value->desc'
              nulls: first|last or absent for dialect default
            partition:
              exclude:
                allowed_when: mode=query_dimensions_except
                required_non_empty_when_present: true
                type: array[qualified dataset.field]
              mode:
                enum:
                - query_dimensions
                - query_dimensions_except
                - time_bucket
                - none
      rolling:
        required:
        - type
        - function
        - periods
        shape:
          function: sum|avg|min|max|count|stddev_pop|stddev_samp|var_pop|var_samp
          periods: integer >= 1 or parameter reference
          require_full_window: boolean = false
          type: rolling
      value:
        required:
        - value.function
        shape:
          value:
            function:
              enum:
              - first_value
              - last_value
              - nth_value
            n: integer >= 1 or parameter reference; nth_value only
            order:
              by: time|value; absent order defaults to time
              direction: 'asc|desc; omitted direction defaults by key: time->asc, value->desc'
              nulls: first|last or absent for dialect default
            partition:
              exclude:
                allowed_when: mode=query_dimensions_except
                required_non_empty_when_present: true
                type: array[qualified dataset.field]
              mode:
                enum:
                - query_dimensions
                - query_dimensions_except
                - time_bucket
                - none
    rules:
    - Choose one sugar form or exactly one general family.
    - Without base, the metric expression is one plain aggregate.
    - With base, the expression is the closest basic-mode approximation.
    - A whole-partition frame uses frame.scope=partition and forbids preceding, reset, require_full_window, units, and order.
    - A base whose measures span datasets may use only a window whose stage and nested dependencies need no shared time axis. Value-ordered windows and whole-partition frames are axis-free unless partition.mode=time_bucket; each nested dependency must also satisfy its own time-axis requirements.
    - A query must group by every partition.exclude dimension anywhere in the metric's dependency chain, or it is refused with window_exclude_not_grouped; the metric catalog lists them as required_dimensions.
    - A window that orders, resets or partitions by time needs its time axis in the group-by at a grain (metric_time:<grain> or the axis field with a grain), anywhere in the metric's dependency chain, or the query is refused with time_axis_not_grouped; the metric catalog marks such a metric requires_time_axis.
    - 'Every other dimension follows recompute semantics: the window re-evaluates over whatever the query groups by. A where_sql condition on grouped fields or on window outputs filters the result, and each kept row keeps the value the whole population gave it; context_filter, or a where_sql condition on an ungrouped field, shrinks the population the window compares within.'
    - Window outputs preserve semantic nulls.
envelope:
  requires:
    current_silent_keys:
    - measure
    - time
    - cardinality
    strategy: include each present capability whose ignore impact is silent
  rules:
  - Use at most one DATUS entry on an OSI object.
  - A version applies only to its own entry and is not inherited.
  - Put each executable key only on one of its declared carriers.
  shape:
    data: JSON string encoding one object
    vendor_name: DATUS
  version:
    generated_value: '1.12'
    key: v
    required_for_generated_payloads: true
examples:
  bucketed_dimension:
    is_dimension: true
    v: '1.12'
  compose:
    derive:
      expr: revenue - total_refunds
      fill: 0
      type: compose
    v: '1.12'
  concept_params:
    concept_params:
      PremierCustomer:
      - default: 3000
        min: 0
        name: margin_min
        type: float
      - default: 6
        min: 1
        name: orders_min
        type: int
    v: '1.12'
  conformed_edge:
    cardinality: many_to_many
    requires:
    - cardinality
    v: '1.12'
  fixed_lod:
    lod:
      expr: fixed(active_days, sessions.user_id)
    requires:
    - lod
    v: '1.12'
  fixed_total:
    derive:
      expr: fixed(revenue)
      type: lod
    v: '1.12'
  integer_month:
    requires:
    - time
    time:
      format: '%Y%m'
      storage: int
    v: '1.12'
  named_measure:
    measure:
      name: orders_new_product_amount_sum
    requires:
    - measure
    v: '1.12'
  nested_window:
    v: '1.12'
    window:
      base: rank_score_stage
      rank:
        function: rank
        partition:
          exclude:
          - scores.market
          mode: query_dimensions_except
  not_a_dimension:
    is_dimension: false
    v: '1.12'
  ordered_date:
    requires:
    - time
    time:
      format: '%Y年%m月%d日'
    v: '1.12'
  parameterized_field:
    is_dimension: true
    params:
    - default: 3000
      min: 0
      name: margin_min
      type: float
    v: '1.12'
  parameterized_filter:
    derive:
      base: pay_total
      type: filter
      where: datediff_pay < :n
    params:
    - allowed:
      - 1
      - 3
      - 7
      - 14
      - 30
      default: 7
      name: n
      type: int
    v: '1.12'
  parameterized_rolling:
    params:
    - default: 3
      max: 12
      min: 1
      name: n
      type: int
    v: '1.12'
    window:
      function: avg
      periods:
        param: n
      type: rolling
  partition_count:
    v: '1.12'
    window:
      base: score
      frame:
        function: count
        partition:
